# Publica el libro en GitHub Pages en cada push a main.
#
# Puesta en marcha (una sola vez):
#   1. Sube el repositorio a GitHub.
#   2. En el repositorio: Settings -> Pages -> Source: "GitHub Actions".
#   3. Haz push a main. La URL sera https://<usuario>.github.io/<repositorio>/
#
# Nota: este flujo NO ejecuta R ni Python (el libro no lo necesita:
# los bloques del invernadero son de solo lectura hasta que se instale
# quarto-live). Si algun dia agregas celdas ejecutadas al renderizar,
# habra que anadir aqui la instalacion correspondiente.

name: Publicar libro

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true          # para la version PDF descargable

      - name: Renderizar el libro
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
